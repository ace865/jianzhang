name: jianzhang
description: 温暖、简洁的个人离线收支手账。
publish_to: none
version: 1.3.0-beta.1+6
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.0.0
  file_picker: ^13.1.0
  lucide_icons_flutter: ^3.0.0
  archive: ^4.3.0
  xml: ^7.0.1
  csv: ^6.0.0
  charset_converter: ^2.5.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  cryptography: ^2.9.0
  crypto: ^3.0.7
  flutter_svg: ^2.2.4
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    - assets/ai-icons/
  fonts:
    - family: LedgerSerif
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
