name: jianzhang
description: 温暖、简洁的个人离线收支手账。
publish_to: none
version: 1.0.0-beta.1+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  fl_chart: ^1.0.0
  file_picker: ^13.1.0
  lucide_icons_flutter: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: LedgerSerif
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
